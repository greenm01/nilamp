# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native:
    name: native build + host tests (linux)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            python3 \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxrandr-dev

      - name: Regenerate amp models
        run: |
          python3 tools/gen_amp_models.py \
            native/generated/nilamp_models.inc \
            models/amps/keller_twd_dlx_ii.kdl
          git diff --exit-code -- native/generated/nilamp_models.inc

      - name: Native host tests
        run: make native-host-test

      - name: Diff whitespace check
        run: git diff --check
